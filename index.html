  }
  function volume(value, unit) {
    if (!['mL', 'L'].includes(unit)) throw new Error('Unidade de volume inválida.');
    return positive(value, 'Volume') * (unit === 'mL' ? 0.001 : 1);
  }
  function finite(value) {
    if (!Number.isFinite(value) || value <= 0) throw new Error('Valores fora do intervalo de cálculo.');

  }
  function dilution(c1, c2, v2, unit = 'mL') {

  function calculate(form){
    const d=Object.fromEntries(new FormData(form));let result,steps,title,unit,label,meaning;
    try{
      if(state.calc==='dilution'){
        const r=ChemCore.dilution(d.c1,d.c2,d.v2,d.unit);result=r.v1;unit=d.unit;title='Diluição';label='Volume da solução inicial';
        steps=[`Conserve a quantidade de soluto: C₁V₁ = C₂V₂.`,`Isole o volume inicial: V₁ = (C₂ × V₂) ÷ C₁.`,`Substitua: V₁ = (${escape(d.c2)} × ${escape(d.v2)}) ÷ ${escape(d.c1)} = ${fmt(r.v1)} ${unit}.`,`Cheque: ${fmt(r.v1L)} L × ${escape(d.c1)} mol/L = ${fmt(r.moles)} mol. Essa quantidade de soluto é conservada.`];
        meaning=r.unchanged?'As concentrações são iguais: não há diluição. O volume inicial é igual ao final.':`A solução final tem ${fmt(r.factor)} vezes menos concentração. ${fmt(r.v1)} ${unit} da solução inicial correspondem ao soluto presente no volume final de ${escape(d.v2)} ${unit}. O volume final é o total da solução, não uma quantidade de solvente a adicionar.`;
      }else if(state.calc==='concentration'){
        const r=ChemCore.concentration(d.mass,d.mm,d.volume,d.unit);result=r.molarity;unit='mol/L';title='Concentração molar';label='Concentração da solução';
        steps=[`Converta a massa em quantidade de matéria: n = m ÷ M.`,`n = ${escape(d.mass)} g ÷ ${escape(d.mm)} g/mol = ${fmt(r.moles)} mol.`,`Converta o volume: ${escape(d.volume)} ${d.unit} = ${fmt(r.liters)} L.`,`C = n ÷ V = ${fmt(r.moles)} ÷ ${fmt(r.liters)} = ${fmt(r.molarity)} mol/L.`];meaning=`Cada litro dessa solução contém ${fmt(r.molarity)} mol de soluto. A concentração em massa é ${fmt(r.massConcentration)} g/L. A massa molar deve corresponder ao soluto informado.`;
      }else{
        const reaction=CHEM.stoich.find(x=>x.id===d.reaction);const r=ChemCore.stoichiometry(d.mass,reaction.ma,reaction.a,reaction.b,reaction.mb);result=r.productMass;unit='g';title='Estequiometria';label=`Massa teórica de ${reaction.product}`;
        steps=[`Use a equação balanceada: ${reaction.equation}.`,`Calcule os mol de ${reaction.reactant}: ${escape(d.mass)} ÷ ${fmt(reaction.ma)} = ${fmt(r.moles)} mol.`,`A razão estequiométrica é ${reaction.b}/${reaction.a}: n(${reaction.product}) = ${fmt(r.moles)} × ${fmt(r.ratio)} = ${fmt(r.productMoles)} mol.`,`Converta para massa: ${fmt(r.productMoles)} × ${fmt(reaction.mb)} = ${fmt(r.productMass)} g.`];meaning=`Esse é o rendimento teórico de ${reaction.product}, considerando reação completa e outros reagentes em excesso. Massas molares aproximadas: ${reaction.reactant} = ${fmt(reaction.ma)} g/mol e ${reaction.product} = ${fmt(reaction.mb)} g/mol.`;
      }
      $('#calc-error').innerHTML='';$('#calc-result').innerHTML=`<span class="badge green">Resultado explicado</span><p class="muted" style="margin:20px 0 0">${label}</p><div class="result-big">${fmt(result)} <small>${unit}</small></div><ol class="step-list">${steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="note">${meaning}</div>`;
      complete('calc-'+state.calc);history(title,`${fmt(result)} ${unit}`);
    }catch(e){$('#calc-error').innerHTML=`<p class="error">${escape(e.message)}</p>`;$('#calc-result').innerHTML='<div class="result-empty"><p>Confira os valores para resolver este exemplo.</p></div>';}
  }

  }
  function tracks(){const tracks=CHEM.tracks.map((t,i)=>i===2?{...t,items:CHEM.problems.map((p,index)=>({id:p.id,name:p.title,route:'desafios',index}))}:t);
    return heading('APRENDER É CONSTRUIR CONEXÕES','Seu próximo passo começa aqui.','Três caminhos para observar, resolver e colocar o conhecimento à prova.',`${pct()}% concluído`)+`<div class="tracks">${tracks.map(t=>{const done=t.items.filter(x=>saved.completed.includes(x.id)).length;return `<section class="panel"><div class="track-head"><div><p class="eyebrow">${t.level.toUpperCase()}</p><h2>${t.name}</h2><p class="muted" style="font-size:12px;margin-bottom:0">${t.description}</p></div><span class="badge ${done===t.items.length?'green':''}">${done}/${t.items.length} etapas</span></div><div class="mini-progress"><span style="width:${done/t.items.length*100}%"></span></div><div class="track-items">${t.items.map(x=>`<a class="track-item ${saved.completed.includes(x.id)?'done':''}" href="#${x.route}${x.reaction?'?reaction='+x.reaction:x.calc?'?calc='+x.calc:x.index!==undefined?'?problem='+x.index:''}">${icon(saved.completed.includes(x.id)?'check':x.route==='desafios'?'quiz':x.route==='calculos'?'calc':'reaction')}<span>${x.name}</span><small>${saved.completed.includes(x.id)?'Concluído · revisar':'Explorar etapa →'}</small></a>`).join('')}</div></section>`;}).join('')}</div>`;
  }
  function about(){return heading('CONHECIMENTO EM CONEXÃO','Química em Movimento','Um projeto educativo de Paulo Vicente Rocha Pinto.')+`<div class="about-grid"><section class="panel"><span class="badge">Química + desenvolvimento de sistemas</span><h2 style="margin-top:22px">Transformar conceitos em experiências.</h2><p>O Química em Movimento aproxima química e tecnologia por meio de representações visuais, simulações e problemas resolvidos. Foi idealizado por Paulo Vicente Rocha Pinto, estudante de Análise e Desenvolvimento de Sistemas e Técnico em Química.</p><p>Esta primeira versão reúne quatro reações ilustradas, três combinações no laboratório virtual, três ferramentas de cálculo e oito desafios originais. Cada experiência conecta o fenômeno, a equação e o raciocínio químico.</p><div class="info-grid"><div class="note"><strong>Representações educativas</strong><br>As partículas, cores e movimentos são simplificados. Não reproduzem escala, velocidade real ou mecanismos completos.</div><div class="note"><strong>Contexto de uso</strong><br>As simulações apoiam o estudo de conceitos. As quantidades e condições de práticas reais exigem orientação, equipamentos e procedimentos adequados.</div></div><div class="note"><strong>Recursos desta versão</strong><br>Conteúdo local, sem conta obrigatória. O aplicativo pode ser usado offline como arquivo HTML; instalação e cache offline no navegador dependem de hospedagem HTTPS ou servidor local.</div></section><section class="panel"><h2>Seu progresso pertence a você.</h2><p class="muted">As etapas e os últimos cálculos são salvos apenas neste navegador. Use a exportação para guardar uma cópia ou transferir para outro dispositivo. Limpar os dados do navegador também apaga esse progresso.</p><div class="privacy-actions"><button class="btn outline small" id="export-progress">Exportar progresso</button><button class="btn outline small" id="import-progress">Importar progresso</button><input id="progress-file" type="file" accept="application/json,.json" hidden><button class="btn outline small danger" id="reset-progress">Recomeçar estudos</button></div><label class="toggle-motion"><input id="motion-toggle" type="checkbox" ${saved.motion?'checked':''}> Animações ativadas</label><div class="note">A preferência por movimento reduzido do dispositivo também é respeitada. Desativar as animações mantém os resultados e explicações visíveis.</div><h3 style="margin-top:28px">Referências para aprofundar</h3><ol class="references"><li><a href="https://openstax.org/books/chemistry-2e/pages/3-3-molarity" target="_blank" rel="noopener">OpenStax · Chemistry 2e, 3.3: Molarity</a><br>Concentração molar e conservação do soluto em diluições.</li><li><a href="https://openstax.org/books/chemistry-2e/pages/4-2-classifying-chemical-reactions" target="_blank" rel="noopener">OpenStax · Chemistry 2e, 4.2: Classifying Chemical Reactions</a><br>Precipitação, reações ácido-base e oxirredução.</li><li><a href="https://openstax.org/books/chemistry-2e/pages/4-3-reaction-stoichiometry" target="_blank" rel="noopener">OpenStax · Chemistry 2e, 4.3: Reaction Stoichiometry</a><br>Relações molares em equações balanceadas.</li></ol><p class="formula-note">Textos, problemas e ilustrações desta aplicação foram desenvolvidos para este projeto. Versão 1.0 · 2026.</p></section></div>`;}
  function render(focus=false){
    document.body.classList.toggle('motion-off',!saved.motion);
    $('#navigation').innerHTML=routes.map(([id,t,i])=>`<a class="nav-link ${id===state.route?'active':''}" href="#${id}" ${id===state.route?'aria-current="page"':''}>${icon(i)}${t}</a>`).join('');
    $('#breadcrumb').textContent=routes.find(r=>r[0]===state.route)[1];
    const views={inicio:home,reacoes:reactions,laboratorio:laboratory,calculos:calculations,desafios:challenges,trilhas:tracks,sobre:about};
    $('#main').innerHTML=views[state.route]();
    $('.local-tag').textContent=storageAvailable?'Progresso neste dispositivo':'Progresso apenas nesta sessão';
    bind();if(focus){$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
  }
  function route(){
    const [part,query='']=location.hash.slice(1).split('?');state.route=routes.some(r=>r[0]===part)?part:'inicio';const params=new URLSearchParams(query);
    if(params.has('reaction') && CHEM.reactions.some(r=>r.id===params.get('reaction'))){state.reaction=params.get('reaction');state.played=false;}
    if(params.has('calc') && ['dilution','concentration','stoich'].includes(params.get('calc')))state.calc=params.get('calc');
    if(params.has('problem')){const i=Number(params.get('problem'));if(Number.isInteger(i)&&i>=0&&i<CHEM.problems.length)state.problem=i;}
    render(true);
  }
  function bind(){
    document.querySelectorAll('[data-reaction]').forEach(el=>el.onclick=()=>{state.reaction=el.dataset.reaction;state.played=false;render();});
    document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;render();});
    if($('#play-reaction'))$('#play-reaction').onclick=()=>{state.played=!state.played;render();};
    if($('#mark-reaction'))$('#mark-reaction').onclick=()=>{complete(state.reaction);render();};
    if($('#lab-form'))$('#lab-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);state.labA=d.get('reagentA');state.labB=d.get('reagentB');state.labResult=ChemCore.mix(state.labA,state.labB);render();};
    document.querySelectorAll('[data-preset]').forEach(el=>el.onclick=()=>{[state.labA,state.labB]=el.dataset.preset.split(',');state.labResult=ChemCore.mix(state.labA,state.labB);render();});
    document.querySelectorAll('[data-calc]').forEach(el=>el.onclick=()=>{state.calc=el.dataset.calc;render();});
    if($('#calc-form')){$('#calc-form').onsubmit=e=>{e.preventDefault();calculate(e.target);};$('#calc-form').addEventListener('input',()=>{$('#calc-result').innerHTML='<div class="result-empty"><p>Os valores mudaram. Calcule novamente para atualizar o resultado.</p></div>';$('#calc-error').innerHTML='';});}
    document.querySelectorAll('[data-problem]').forEach(el=>el.onclick=()=>{state.problem=Number(el.dataset.problem);render();});
    if($('#quiz-form')){
      $('#quiz-form').onsubmit=e=>{e.preventDefault();checkQuiz(e.target);};
      $('#quiz-hint').onclick=()=>{$('#hint').innerHTML=`<div class="hint"><strong>Uma pista:</strong> ${CHEM.problems[state.problem].hint}</div>`;};
      $('#prev-problem').onclick=()=>{if(state.problem>0){state.problem--;render();}};
      $('#next-problem').onclick=()=>{if(state.problem<CHEM.problems.length-1){state.problem++;render();}};
    }
    if($('#export-progress'))$('#export-progress').onclick=()=>download('quimica-em-movimento-progresso.json',JSON.stringify(saved,null,2),'application/json');
    if($('#import-progress')){
      $('#import-progress').onclick=()=>$('#progress-file').click();
      $('#progress-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>100000)throw new Error('O arquivo é maior que o esperado.');const imported=validateSave(JSON.parse(await file.text()));saved.completed=[...new Set([...saved.completed,...imported.completed])];saved.history=imported.history;persist();render();toast('Progresso importado e combinado com seus estudos.');}catch(err){toast('Não foi possível importar: '+err.message);}};
      $('#reset-progress').onclick=()=>{if(confirm('Apagar as etapas e o histórico salvos neste navegador? Exporte uma cópia antes, se quiser guardá-los.')){saved.completed=[];saved.history=[];persist();render();toast('Seus estudos estão prontos para um novo começo.');}};
      $('#motion-toggle').onchange=e=>{saved.motion=e.target.checked;persist();document.body.classList.toggle('motion-off',!saved.motion);};
    }
  }
  let installPrompt;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install').hidden=false;});
  $('#install').onclick=async()=>{if(!installPrompt)return;await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#install').hidden=true;};
  window.addEventListener('appinstalled',()=>{$('#install').hidden=true;toast('Aplicativo instalado. Bons estudos!');});
  window.addEventListener('hashchange',route);
  window.addEventListener('storage',e=>{if(e.key===key){try{saved=e.newValue?validateSave(JSON.parse(e.newValue)):{version:1,completed:[],history:[],motion:true};render();}catch(_){}}});
  if('serviceWorker' in navigator && ['https:','http:'].includes(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  route();
})();
</script>
</body>
</html>
